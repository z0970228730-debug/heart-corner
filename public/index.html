<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="芯彤美學 Heart studio 的會員小角落：每日任務、塔羅指引、漢芳療保養建議、芯幣與折價券。">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<script src="/assets/qrcode.js"></script>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
<title>芯彤的小角落</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#f6eeea">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Noto+Serif+TC:wght@500;600&family=Noto+Sans+TC:wght@400;500&display=swap">
<style>
/* Layout: 手機優先的「小角落」App 外殼（最寬 460px），冬夜水彩插畫＋貓咪對話泡泡貫穿每一頁；桌機置中，兩側是柔光。
   單一暖色主題（刻意不做深色版，配合插畫原稿的暖燈色調）。 */
:root{
  --ink:#574a4f;        /* 主要文字：帶玫瑰調的深灰 */
  --sub:#8a7c80;        /* 次要文字 */
  --faint:#b3a5a7;
  --paper:#fffaf6;      /* 外殼底 */
  --card:#fffdfa;
  --cream:#f7ece4;
  --blush:#f3e2dc;
  --line:#ecdfd9;
  --mauve:#7c6a7e;      /* 主色：冬夜紫灰 */
  --mauve-deep:#5f4f63;
  --rose:#b07f78;       /* 點綴：暖玫瑰 */
  --gold:#c49a62;       /* 芯幣金 */
  --gold-soft:#ead7b6;
  --night:#8a849b;
  --ground:#efe7e6;     /* 桌機背景 */
  --shadow:0 10px 30px rgba(104,80,84,.09);
  --shadow-lift:0 16px 40px rgba(104,80,84,.16);
  --serif:'Noto Serif TC','Songti TC',serif;
  --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  --latin:'Cormorant Garamond','Iowan Old Style',Georgia,serif;
  --r-lg:22px;--r-md:16px;--r-sm:12px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
input,textarea,select{font-size:16px!important}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
.glow{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at 15% 0%,#fff4e4 0,transparent 45%),radial-gradient(ellipse at 90% 80%,#e4dcea 0,transparent 55%)}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:disabled{cursor:default}
a{color:inherit}
:focus-visible{outline:2.5px solid var(--rose);outline-offset:3px;border-radius:8px}
h1:focus,h2:focus{outline:none}
img{display:block;max-width:100%}
.num{font-variant-numeric:lining-nums tabular-nums}
.eyebrow,.metric b,.purse .bal,.ring .val b,.orbit b,.amounts button b,.ticket .t-code,.ticket .t-val b,.hist .amt,.code-box b,.tile-wide .gift,.tfront .roman,.today-top .date{font-variant-numeric:lining-nums tabular-nums}
a.btn{text-decoration:none}

.shell{position:relative;z-index:1;width:min(100%,460px);min-height:100svh;margin:0 auto;background:var(--paper);box-shadow:0 0 70px rgba(80,60,72,.12);padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));overflow-x:hidden}
.gutter{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}

/* ---------- 頂部列 ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;height:62px;background:rgba(255,250,246,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid transparent;transition:border-color .3s}
.topbar.scrolled{border-bottom-color:var(--line)}
.brand{display:flex;align-items:center;gap:10px;text-align:left}
.brand-mark{width:34px;height:34px}
.brand b{display:block;font-family:var(--latin);font-style:italic;font-weight:600;font-size:19px;letter-spacing:.2px;line-height:1.1}
.brand small{display:block;font-size:10.5px;letter-spacing:1.5px;color:var(--faint)}
.wallet-chip{display:flex;align-items:center;gap:6px;height:36px;padding:0 12px 0 6px;border-radius:99px;background:var(--card);border:1px solid var(--line);box-shadow:0 3px 10px rgba(110,80,70,.06);font-weight:500;font-size:14px}
.wallet-chip svg{width:26px;height:26px}
.wallet-chip .fish{width:18px;height:18px;margin-left:6px}
.wallet-chip i{font-style:normal;color:var(--sub);font-size:13px}

/* ---------- 共用元素 ---------- */
.coin{display:inline-block;vertical-align:-0.2em}
.eyebrow{font-family:var(--latin);font-size:12.5px;letter-spacing:3px;text-transform:uppercase;color:var(--rose)}
.h2{font-family:var(--serif);font-weight:600;font-size:22px;line-height:1.35;letter-spacing:.5px;margin:4px 0 0;text-wrap:balance}
.h3{font-family:var(--serif);font-weight:600;font-size:17px;margin:0;letter-spacing:.3px}
.muted{color:var(--sub);font-size:13.5px}
.tiny{font-size:12px;color:var(--faint);line-height:1.6}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 24px;border-radius:99px;font-weight:500;letter-spacing:.5px;transition:transform .15s,box-shadow .2s,background .2s}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--mauve);color:#fff;box-shadow:0 8px 20px rgba(95,79,99,.25)}
.btn-primary:hover{background:var(--mauve-deep)}
.btn-ghost{background:var(--card);border:1px solid var(--line);color:var(--ink)}
.btn-gold{background:linear-gradient(135deg,#d8b27a,#b98a52);color:#fff;box-shadow:0 8px 20px rgba(185,138,82,.3)}
.btn:disabled{opacity:.45;box-shadow:none}
.btn-block{width:100%}
.section{padding-block:26px 6px}
.stack{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.stack>*,.ticket>*,.card>*{min-width:0}

/* 頁面標題區：插畫天空＋貓咪泡泡 */
.page{animation:pageIn .45s ease both}
@keyframes pageIn{from{opacity:.4;transform:translateY(8px)}to{opacity:1;transform:none}}
.sky{position:relative;padding-block:26px 46px;background:linear-gradient(170deg,#8d879e 0%,#a89caf 40%,#d9c3c6 78%,var(--paper) 100%);color:#fff;overflow:hidden}
.sky::after{content:"";position:absolute;left:-10%;right:-10%;bottom:-38px;height:70px;background:var(--paper);border-radius:50% 50% 0 0}
.sky .eyebrow{color:#fdf1e4;opacity:.9}
.sky .h2{color:#fff;font-size:25px;text-shadow:0 2px 12px rgba(70,55,80,.25)}
.sky p{margin:6px 0 0;color:#fbf2ec;font-size:14px}
.snow{position:absolute;inset:0;pointer-events:none}
.snow span{position:absolute;color:#fff8e6;opacity:.8;text-shadow:0 0 8px #ffe7c4;animation:twinkle 3.6s ease-in-out infinite}
@keyframes twinkle{50%{opacity:.25;transform:scale(.8)}}

.talk{display:flex;align-items:flex-end;gap:10px;margin-top:14px;position:relative;z-index:2}
.talk-cat{flex:none;width:52px;height:52px;border-radius:50%;overflow:hidden;border:2px solid #fff;box-shadow:0 6px 14px rgba(70,50,60,.18);background:var(--cream)}
.talk-cat img{width:100%;height:100%;object-fit:cover;object-position:52% 55%;transform:scale(1.9)}
.bubble{position:relative;background:#fff;color:var(--ink);border-radius:18px 18px 18px 6px;padding:10px 14px;font-size:14px;line-height:1.6;box-shadow:0 8px 20px rgba(80,60,70,.12);max-width:300px}
.bubble b{color:var(--rose);font-weight:500}
.bubble.pop{animation:bubblePop .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes bubblePop{from{transform:scale(.85);opacity:.3}to{transform:none;opacity:1}}

/* ---------- 首頁 ---------- */
.hero{position:relative}
.hero-img{width:100%;aspect-ratio:3/2;object-fit:cover}
.hero::after{content:"";position:absolute;inset:auto 0 0;height:45%;background:linear-gradient(transparent,var(--paper))}
.hero-talk{position:absolute;left:max(18px,env(safe-area-inset-left,0px));right:18px;top:16px;z-index:2}
.hero-talk .bubble{max-width:250px;border-radius:18px 18px 6px 18px;margin-left:auto}
.hello{position:relative;z-index:2;margin-top:-34px;text-align:center}
.hello h1{font-family:var(--serif);font-weight:600;font-size:27px;line-height:1.4;letter-spacing:1px;margin:0;text-wrap:balance}
.hello h1 em{font-style:normal;color:var(--rose)}
.hello p{margin:8px 0 0;color:var(--sub);font-size:14.5px}

.today{margin-top:22px;padding:18px;display:grid;gap:16px;background:linear-gradient(160deg,#fffdfa,#fbf1eb)}
.today-top{display:flex;justify-content:space-between;align-items:baseline}
.today-top .date{font-family:var(--latin);font-size:15px;color:var(--sub);letter-spacing:.5px}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.metric{display:grid;justify-items:center;gap:2px;padding:12px 4px;border-radius:var(--r-md);background:#fff;border:1px solid var(--line);text-align:center}
.metric svg{width:28px;height:28px}
.metric b{font-family:var(--latin);font-size:24px;font-weight:600;line-height:1.1;color:var(--ink)}
.metric small{font-size:11.5px;color:var(--sub);letter-spacing:.5px}
.progress{height:8px;border-radius:9px;background:var(--blush);overflow:hidden}
.progress i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#d7b0a6,var(--rose));transition:width .6s ease}
.progress-row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--sub);margin-bottom:6px}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;display:flex;flex-direction:column;justify-content:flex-end;min-height:168px;padding:14px;border-radius:var(--r-lg);overflow:hidden;text-align:left;color:#fff;box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s;isolation:isolate}
.tile:hover{transform:translateY(-3px);box-shadow:var(--shadow-lift)}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;transition:transform .5s}
.tile:hover img{transform:scale(1.05)}
.tile::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,transparent 30%,rgba(66,48,62,.72))}
.tile b{font-family:var(--serif);font-size:17px;font-weight:600;letter-spacing:.5px}
.tile small{font-size:12px;opacity:.92}
.tile .badge{position:absolute;top:12px;left:12px;padding:3px 10px;border-radius:99px;background:rgba(255,250,246,.9);color:var(--mauve-deep);font-size:11.5px;font-weight:500}
.tile .badge.done{background:var(--mauve);color:#fff}
.tile-wide{grid-column:1/-1;min-height:120px;flex-direction:row;align-items:center;justify-content:space-between;color:var(--ink);background:linear-gradient(120deg,#f6e7dd,#eee3ee)}
.tile-wide::before{display:none}
.tile-wide .tw-copy{display:grid;gap:2px}
.tile-wide small{color:var(--sub)}
.tile-wide .gift{font-family:var(--latin);font-size:30px;font-weight:600;color:var(--rose);line-height:1}
.tile-wide .gift small{display:block;font-family:var(--sans);font-size:11px;color:var(--sub);text-align:right}

.quote-card{padding:22px 20px;text-align:center;background:var(--card);position:relative}
.quote-card::before,.quote-card::after{content:"";position:absolute;width:14px;height:14px;border:1px solid var(--gold-soft)}
.quote-card::before{top:10px;left:10px;border-right:0;border-bottom:0}
.quote-card::after{bottom:10px;right:10px;border-left:0;border-top:0}
.quote-card p{font-family:var(--serif);font-size:17px;line-height:1.9;margin:10px 0;white-space:pre-line}
.quote-card .sign{font-family:var(--latin);font-style:italic;color:var(--sub)}

.studio{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;padding:16px}
.studio img{width:76px;height:76px;border-radius:50%;object-fit:cover}
.studio .links{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip-link{display:inline-flex;align-items:center;gap:4px;height:32px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:#fff;font-size:13px;text-decoration:none}
.chip-link.main{background:var(--mauve);color:#fff;border-color:var(--mauve)}

/* ---------- 抽牌 ---------- */
.seg{display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:99px;background:var(--cream);border:1px solid var(--line)}
.seg button{height:40px;border-radius:99px;font-size:14px;color:var(--sub);transition:background .25s,color .25s}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);font-weight:500;box-shadow:0 3px 10px rgba(110,80,80,.1)}
.deck{position:relative;height:250px;margin-top:4px}
.deck .tcard{position:absolute;left:50%;top:40px;width:76px;margin-left:-38px;aspect-ratio:360/620;transform-origin:50% 320%;transition:transform .45s cubic-bezier(.3,1.2,.5,1),opacity .4s,top .3s}
.deck.shuffling .tcard{transition:none}
.deck.spread .tcard{cursor:pointer}
.deck.spread .tcard:hover,.deck.spread .tcard:focus-visible{top:22px}
.deck .tcard .tback{border-radius:9px}
.deck .tcard .tback::before{inset:4px;border-radius:6px}
.deck .tcard .tback::after{inset:7px;background-size:9px 9px}
.ritual{display:grid;gap:10px;justify-items:center;text-align:center}
.ritual-steps{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--faint)}
.ritual-steps span.on{color:var(--rose);font-weight:500}
.ritual-steps i{width:18px;height:1px;background:var(--line)}
.ask{width:100%;max-width:340px;text-align:left}
.asked{padding:12px 16px;border-radius:var(--r-md);background:var(--cream);text-align:center}
.asked span{font-size:12px;letter-spacing:1px;color:var(--rose)}
.asked p{margin:2px 0 0;font-family:var(--serif);font-size:16px}
.history{display:grid;gap:10px}
.hist-cards{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.hist-cards button{flex:none;width:76px;display:grid;gap:4px;text-align:center;font-size:11.5px;color:var(--sub);opacity:.6}
.hist-cards button[aria-pressed="true"]{opacity:1;color:var(--ink)}
.hist-cards img{width:76px;border-radius:7px;box-shadow:0 4px 10px rgba(80,60,70,.15)}
.hist-cards span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.4}
.tcard{aspect-ratio:7/11.5;border-radius:14px}
.tback{width:100%;height:100%;border-radius:14px;background:radial-gradient(circle at 50% 42%,#9a8aa0 0,#6f5f74 70%);border:1px solid #5c4d61;box-shadow:0 12px 26px rgba(70,50,70,.28);position:relative;overflow:hidden}
.tback::before{content:"";position:absolute;inset:7px;border:1px solid rgba(234,215,182,.75);border-radius:9px}
.tback::after{content:"";position:absolute;inset:12px;border-radius:6px;background-image:radial-gradient(rgba(255,240,210,.45) 1px,transparent 1.3px);background-size:14px 14px;opacity:.6}
.tback svg{position:absolute;left:50%;top:50%;width:52%;transform:translate(-50%,-50%);z-index:1}
.deck-hint{text-align:center;margin-top:4px}

.reveal{display:grid;gap:18px}
.flip{width:min(230px,62vw);margin:6px auto 0;aspect-ratio:7/11.5;perspective:1400px}
.flip-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.4,.1,.2,1)}
.flip.on .flip-inner{transform:rotateY(180deg)}
.flip .face:not(.front){transition:visibility 0s .5s}
.flip.on .face:not(.front){visibility:hidden}
.tback,.tback svg,.tarot-img{-webkit-backface-visibility:hidden;backface-visibility:hidden}
.flip .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px}
.flip .front{transform:rotateY(180deg)}
.wrong{font-family:var(--latin)}

.reading{padding:20px;display:grid;gap:16px}
.keys{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.keys span{padding:3px 12px;border-radius:99px;background:var(--cream);font-size:12.5px;color:var(--mauve-deep)}
.reading .meaning{font-size:15px;line-height:1.95;margin:0}
.divider{display:flex;align-items:center;gap:10px;color:var(--gold);font-family:var(--latin);font-size:13px;letter-spacing:2px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.oil{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;padding:16px;border-radius:var(--r-md);background:linear-gradient(140deg,#fff,var(--chakra-soft,#f6ebe3));border:1px solid var(--line)}
.oil .drop{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:#fff;border:1px solid var(--line)}
.oil .drop svg{width:22px;height:22px}
.oil h4{margin:0;font-family:var(--serif);font-size:16px;font-weight:600}
.oil h4 small{font-family:var(--sans);font-weight:400;font-size:12px;color:var(--sub);margin-left:6px}
.oil p{margin:4px 0 0;font-size:13.5px;line-height:1.8;color:var(--ink)}
.oil .how{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:13px;color:var(--sub)}
.chakra-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:1px}
.warm-card{padding:28px 22px;text-align:center;background:linear-gradient(165deg,#fffdf9,#f7ebe4);border-radius:var(--r-lg);border:1px solid #ead9cc;box-shadow:var(--shadow);position:relative}
.warm-card .h{font-family:var(--latin);letter-spacing:3px;color:var(--gold);font-size:13px}
.warm-card p{font-family:var(--serif);font-size:19px;line-height:2;margin:14px 0;white-space:pre-line}
.warm-art{border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* 正版牌面與解讀 */
.flip{aspect-ratio:360/620}
.tarot-img{width:100%;height:100%;object-fit:cover;border-radius:14px;box-shadow:0 18px 36px rgba(90,64,70,.25);border:1px solid #e3cfb8}
.en-name{font-family:var(--latin);font-style:italic;font-size:16px;color:var(--sub)}
.insight{display:grid;gap:10px;padding:14px 16px;border-radius:var(--r-md);background:var(--cream)}
.ins-row{display:grid;gap:2px}
.ins-tag{font-size:12px;letter-spacing:1px;color:var(--rose);font-weight:500}
.ins-row p{margin:0;font-family:var(--serif);font-size:15px;line-height:1.8}
.chakra-card{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:12px 14px;border-radius:var(--r-md);border:1px solid var(--line);background:#fff}
.ck-dot{width:14px;height:14px;border-radius:50%;margin-top:6px;box-shadow:0 0 0 4px var(--chakra-soft)}
.chakra-card b{font-family:var(--serif);font-size:16px}
.ck-sk{font-family:var(--latin);font-style:italic;font-size:14px;color:var(--sub)}
.ck-meta{font-size:13px;color:var(--sub)}
.latin{font-family:var(--latin);font-style:italic;font-size:14.5px;color:var(--sub);margin-top:-2px}
.spec{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:8px 0 4px;font-size:13px}
.spec dt{color:var(--sub)}.spec dd{margin:0}
.oil .alt{font-size:12.5px;color:var(--sub);border-top:1px dashed var(--line);padding-top:8px;margin-top:8px}
.oil .alt i{font-family:var(--latin)}
.ing-ch{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px}
.ing-ch span{font-size:11.5px;padding:2px 9px;border-radius:99px;border:1px solid var(--cc);color:var(--ink);background:#fff}
.ing-ch span.on{background:var(--cc);color:#fff;font-weight:500}
.stage-pick{display:grid;gap:6px;padding:14px 16px;border-radius:var(--r-md);background:var(--cream)}
.stage-pick b{font-weight:500}
.sub-ings{display:grid;gap:10px;margin-top:10px}
.sub-ing{padding-top:10px;border-top:1px dashed var(--line)}
.sub-ing b{font-family:var(--serif);font-size:15px}
.sub-ing i{font-family:var(--latin);font-size:13px;color:var(--sub)}
.sub-tag{margin-left:6px;font-size:11px;color:var(--rose)}
.sub-ing p{margin:4px 0 0;font-size:13px}
.alt-prods{display:grid;gap:8px;padding:12px 14px;border-radius:var(--r-md);border:1px solid var(--line);background:#fff}
.alt-prod{display:grid;gap:2px;padding-top:8px;border-top:1px solid var(--line)}
.alt-prods .herb-tag+.alt-prod{border-top:0;padding-top:0}
.alt-prod b{font-weight:500;font-size:14px}
.alt-prod span{font-size:12.5px;color:var(--sub)}
.herb{padding:12px 14px;border-radius:var(--r-md);background:linear-gradient(120deg,#fbf3e8,#f6ece2);border:1px solid #eedfc9}
.herb-tag{font-size:12px;letter-spacing:1px;color:var(--gold);font-weight:500}
.herb{display:grid;gap:8px}
.herb p{margin:0;font-size:13.5px;line-height:1.8}
.care-steps{margin:0;padding-left:20px;display:grid;gap:4px;font-size:13.5px;line-height:1.75}
.care-steps li::marker{color:var(--gold);font-family:var(--latin);font-weight:600}
.care-note{font-size:12.5px!important;color:var(--sub)}
.product{display:grid;gap:8px;padding:12px 14px;border-radius:var(--r-sm);background:#fff;border:1px solid #eedfc9}
.pr-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.pr-head b{font-family:var(--serif);font-size:17px}
.pr-head small{font-size:12.5px;color:var(--sub)}
.pr-tag{font-size:11px;padding:1px 8px;border-radius:99px;background:var(--gold);color:#fff}
.product .spec{margin:0}
.btn-pair{display:grid;gap:6px}
.btn-pair .task-btn{min-width:84px}
.studio-pick{color:var(--mauve-deep)}

/* ---------- 任務 ---------- */
.ring-wrap{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;padding:18px}
.ring{width:104px;height:104px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .val{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .val b{font-family:var(--latin);font-size:30px;font-weight:600;line-height:1}
.ring .val small{font-size:11px;color:var(--sub)}
.streak{display:flex;gap:6px;margin-top:10px}
.streak span{flex:1;height:30px;border-radius:9px;display:grid;place-items:center;font-size:11px;color:var(--faint);background:var(--cream);border:1px solid var(--line)}
.streak span.on{background:var(--mauve);color:#fff;border-color:var(--mauve)}
.streak span.gift{border-style:dashed;border-color:var(--gold);color:var(--gold)}
.tasks{display:grid;gap:10px}
.task{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:14px;border-radius:var(--r-md);background:var(--card);border:1px solid var(--line);transition:background .3s,opacity .3s}
.task .ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--cream)}
.task .ic svg{width:22px;height:22px;fill:none;stroke:var(--rose);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.task b{display:block;font-weight:500;font-size:15px}
.task small{display:block;font-size:12.5px;color:var(--sub);line-height:1.5}
.task .reward{display:inline-flex;align-items:center;gap:2px;font-size:12px;color:var(--gold);margin-top:2px}
.task .reward svg{width:15px;height:15px}
.task-btn{min-width:72px;height:36px;padding:0 14px;border-radius:99px;font-size:13px;font-weight:500;border:1px solid var(--line);background:#fff}
.task-btn.claim{background:var(--gold);border-color:var(--gold);color:#fff;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(196,154,98,.18)}}
.task.done{background:#faf5f2}
.task.done b{color:var(--sub)}
.task-btn.ok{color:var(--mauve);border-color:transparent;background:transparent}
.mini-prog{height:4px;border-radius:4px;background:var(--blush);margin-top:6px;overflow:hidden}
.mini-prog i{display:block;height:100%;background:var(--rose)}

.breath{padding:22px;text-align:center;display:grid;gap:14px;justify-items:center}
.orbit{width:180px;height:180px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#fff 0,#f4e5e2 60%,transparent 61%);position:relative}
.orbit::before{content:"";position:absolute;inset:0;border-radius:50%;border:1px solid var(--gold-soft);transform:scale(var(--s,.7));transition:transform var(--d,4s) ease-in-out;background:radial-gradient(circle,rgba(176,127,120,.12),rgba(124,106,126,.1))}
.orbit div{position:relative;display:grid;gap:2px}
.orbit b{font-family:var(--latin);font-size:40px;font-weight:600;line-height:1}
.orbit span{font-size:14px;color:var(--sub)}

/* ---------- 貓咪小屋 ---------- */
.house{position:relative;border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow-lift)}
.house img,.house .cat-vid{width:100%;aspect-ratio:3/2;object-fit:cover;cursor:pointer;display:block;background:#e9dcd6}
.house .cat-react{position:absolute;inset:0;height:100%;opacity:0;pointer-events:none;transition:opacity .25s}
.house .cat-react.on{opacity:1}
@keyframes purr{30%{transform:scale(1.02) rotate(-.3deg)}60%{transform:scale(1.01) rotate(.3deg)}}
.house .bubble{position:absolute;top:14px;left:14px;max-width:72%;pointer-events:none}
.house .pet-hint{position:absolute;right:12px;bottom:12px;padding:6px 14px;border-radius:99px;background:rgba(255,250,246,.92);font-size:13px;font-weight:500;color:var(--mauve-deep);pointer-events:none}
.float{position:absolute;pointer-events:none;font-size:22px;color:var(--rose);animation:floatUp 1.2s ease-out forwards;z-index:5}
@keyframes floatUp{to{transform:translateY(-70px) scale(1.3);opacity:0}}
.feed{padding:18px;display:grid;gap:14px}
.bowl-row{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.bowl{position:relative;width:96px;height:76px}
.bowl svg{width:100%;height:100%}
.bowl b{position:absolute;right:-6px;top:-6px;min-width:30px;height:30px;padding:0 8px;border-radius:99px;background:var(--rose);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:500}
.rate{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13.5px;color:var(--sub)}
.rate svg{width:20px;height:20px}
.rate .eq{font-family:var(--latin);font-size:18px;color:var(--gold)}
.feed-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cap{font-size:12px;color:var(--faint)}
.fly{position:fixed;z-index:60;width:28px;height:28px;pointer-events:none;transition:transform .8s cubic-bezier(.5,-.4,.5,1),opacity .8s}

/* ---------- 芯幣錢包 ---------- */
.purse{position:relative;margin-top:-30px;z-index:2;padding:22px 20px;background:linear-gradient(145deg,#fffaf2,#f6e6d4);border:1px solid #ead6bc;text-align:center;overflow:hidden}
.purse::before{content:"";position:absolute;width:220px;height:220px;right:-70px;top:-90px;border-radius:50%;background:radial-gradient(circle,rgba(196,154,98,.18),transparent 70%)}
.purse .big-coin{width:76px;height:76px;margin:0 auto;animation:spinIn 1s ease both}
@keyframes spinIn{from{transform:rotateY(180deg) scale(.6);opacity:0}}
.purse .bal{font-family:var(--latin);font-size:52px;font-weight:600;line-height:1;margin-top:8px;color:var(--ink)}
.purse .bal small{font-family:var(--serif);font-size:16px;margin-left:4px;color:var(--sub)}
.purse .worth{margin-top:4px;font-size:13.5px;color:var(--sub)}
.purse .worth b{color:var(--rose);font-weight:500}
.notice{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-sm);background:#fdf3e6;border:1px solid #f1dfc2;font-size:13px;line-height:1.6;text-align:left;margin-top:14px}
.notice svg{flex:none;width:18px;height:18px;margin-top:2px;fill:none;stroke:var(--gold);stroke-width:1.8}
.redeem{padding:18px;display:grid;gap:14px}
.amounts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.amounts button{padding:10px 4px;border-radius:var(--r-md);border:1px solid var(--line);background:#fff;display:grid;gap:0;justify-items:center}
.amounts button b{font-family:var(--latin);font-size:22px;font-weight:600;line-height:1.2}
.amounts button small{font-size:11.5px;color:var(--sub)}
.amounts button[aria-pressed="true"]{border-color:var(--gold);background:#fdf6ea;box-shadow:0 0 0 2px rgba(196,154,98,.25)}
.amounts button:disabled{opacity:.4}
.ticket{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:16px 18px;border-radius:var(--r-md);background:linear-gradient(120deg,#fff,#fbefe4);border:1px solid #ecd7c1;overflow:hidden}
.ticket::before,.ticket::after{content:"";position:absolute;right:92px;width:16px;height:16px;border-radius:50%;background:var(--paper);border:1px solid #ecd7c1}
.ticket::before{top:-9px}.ticket::after{bottom:-9px}
.ticket .t-title{font-weight:500}
.ticket .t-code{font-family:var(--latin);font-size:18px;font-weight:600;letter-spacing:1.5px;color:var(--mauve-deep);overflow-wrap:anywhere}
.ticket .t-meta{font-size:12px;color:var(--sub)}
.ticket .t-val{border-left:1px dashed #e2c9ae;padding-left:16px;text-align:center;min-width:76px}
.ticket .t-val b{display:block;font-family:var(--latin);font-size:26px;font-weight:600;color:var(--rose);line-height:1.1}
.ticket .t-val small{font-size:11px;color:var(--sub)}
.ticket.used{opacity:.5}
.ticket .stamp{position:absolute;right:100px;top:50%;transform:translateY(-50%) rotate(-12deg);border:2px solid var(--rose);color:var(--rose);padding:0 8px;border-radius:6px;font-size:12px;font-weight:500}
.hist{display:grid}
.hist div{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 2px;border-bottom:1px solid var(--line)}
.hist div:last-child{border-bottom:0}
.hist b{font-weight:500;font-size:14px}
.hist time{font-size:12px;color:var(--faint);grid-column:1}
.hist .amt{grid-row:1/3;grid-column:2;align-self:center;font-family:var(--latin);font-size:19px;font-weight:600}
.hist .plus{color:var(--gold)}
.hist .minus{color:var(--sub)}
details.rules{border-radius:var(--r-md);background:var(--card);border:1px solid var(--line);padding:0 16px}
details.rules summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;height:52px;font-weight:500}
details.rules summary::-webkit-details-marker{display:none}
details.rules summary::after{content:"+";font-size:20px;color:var(--rose);transition:transform .3s}
details.rules[open] summary::after{transform:rotate(45deg)}
.rule-list{margin:0 0 16px;padding:0;list-style:none;display:grid;gap:10px;font-size:13.5px;line-height:1.7}
.rule-list li{display:grid;grid-template-columns:86px 1fr;gap:10px;padding-top:10px;border-top:1px dashed var(--line)}
.rule-list li span:first-child{color:var(--sub)}

/* ---------- 評論小幫手 ---------- */
.rv{padding:18px;display:grid;gap:12px}
.rv-q{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.rv-q b{font-weight:500;font-size:15px}
.rv-q small{font-size:12px;color:var(--faint)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{min-height:36px;padding:6px 14px;border-radius:99px;border:1px solid var(--line);background:#fff;font-size:13.5px;line-height:1.4;transition:background .2s,border-color .2s,color .2s}
.chips button[aria-pressed="true"]{background:#f6ece9;border-color:var(--rose);color:var(--mauve-deep);font-weight:500}
.chips button[aria-pressed="true"]::before{content:"✓ ";color:var(--rose)}
.rv-out{display:grid;gap:10px}
.rv-out textarea{width:100%;min-height:290px;resize:vertical;border-radius:var(--r-md);border:1px solid var(--line);background:#fffefc;padding:14px 16px;font:inherit;font-size:15px;line-height:1.9;color:var(--ink)}
.rv-out textarea:focus{outline:2px solid var(--rose);outline-offset:0;border-color:transparent}
.rv-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--faint)}
.rv-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rv-steps{margin:0;padding-left:20px;font-size:13.5px;color:var(--sub);display:grid;gap:4px}

/* 香氣翻牌 */
.play-stats{display:grid;grid-template-columns:repeat(3,1fr);padding:12px 6px;text-align:center}
.play-stats small{display:block;font-size:12px;color:var(--sub)}
.play-stats b{font-family:var(--latin);font-size:22px;font-weight:600}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;perspective:1000px}
.mcard{aspect-ratio:3/4;position:relative;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.mcard .m-back{transition:visibility 0s .25s}
.mcard.on .m-back{visibility:hidden}
.mcard:not(.on) .m-front{visibility:hidden;transition:visibility 0s .25s}
.m-face svg,.m-face b,.m-face small{-webkit-backface-visibility:hidden;backface-visibility:hidden}
.tcard,.flip,.deck{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.m-inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,.1,.2,1)}
.mcard.on .m-inner{transform:rotateY(180deg)}
.m-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:12px;display:grid;place-items:center}
.m-back{background:radial-gradient(circle at 50% 42%,#9a8aa0 0,#6f5f74 70%);border:1px solid #5c4d61;box-shadow:0 6px 14px rgba(70,50,70,.2)}
.m-back svg{width:44%}
.m-front{transform:rotateY(180deg);background:#fffdfa;border:1.5px solid var(--mc);align-content:center;gap:2px;padding:6px;text-align:center;box-shadow:0 6px 14px rgba(70,50,70,.12)}
.m-front svg{width:38%;height:auto}
.m-front b{font-size:13px;font-weight:500;line-height:1.3}
.m-front small{font-size:10.5px;color:var(--sub)}
.mcard.got .m-front{background:color-mix(in srgb,var(--mc) 14%,#fff)}
.mcard.got{animation:gotPop .4s ease}
@keyframes gotPop{50%{transform:scale(1.06)}}
.fact{padding:14px 16px;display:grid;gap:8px}
.fact.pop{animation:bubblePop .4s cubic-bezier(.3,1.6,.5,1)}
.fact-head{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center}
.fact-head svg{width:34px}
.fact-head b{display:block;font-family:var(--serif);font-size:16px;margin-top:2px}
.fact p{margin:0;font-size:14px;line-height:1.85}
.play-done{padding:18px;display:grid;gap:10px;text-align:center;justify-items:center}
.stars{display:flex;gap:6px;font-size:30px;color:var(--line)}
.stars .on{color:var(--gold)}
/* 貓咪成長 */
.lv-tag{position:absolute;left:12px;bottom:12px;padding:5px 12px;border-radius:99px;background:rgba(95,79,99,.85);color:#fff;font-size:12.5px;pointer-events:none;z-index:3}
.dc{position:absolute;pointer-events:none;z-index:2}
.dc-lights{left:0;top:0;width:100%;height:44px}
.dc-tree{left:10px;bottom:40px;width:54px}
.dc-yarn{left:68px;bottom:44px;width:34px}
.dc-frame{right:14px;top:52px;width:52px}
.growth{padding:18px;display:grid;gap:12px}
.g-head{display:flex;justify-content:space-between;align-items:flex-end}
.decor-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.decor{display:grid;justify-items:center;gap:2px;padding:10px 4px;border-radius:var(--r-md);border:1px solid var(--line);background:#fff;text-align:center}
.decor .d-ic svg{width:34px;height:34px}
.decor b{font-size:12.5px;font-weight:500}
.decor small{font-size:10.5px;color:var(--sub)}
.decor.on{border-color:var(--gold);background:#fdf6ea}
.decor:disabled{opacity:.45}
/* 媽媽小幫手 */
.water,.mood,.cal{padding:18px;display:grid;gap:12px}
.cups{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.cup svg{width:100%;height:auto}
.cup .wtr{opacity:0;transform:scaleY(0);transform-origin:50% 100%;transition:transform .35s,opacity .2s}
.cup.full .wtr{opacity:1;transform:none}
.water-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;font-size:14px}
.goal-ctl{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--sub)}
.goal-ctl button{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:#fff}
.mood-row{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.mood-row button{display:grid;justify-items:center;gap:6px;padding:10px 2px;border-radius:var(--r-md);border:1px solid var(--line);background:#fff;font-size:12.5px}
.mood-row i{width:24px;height:24px;border-radius:50%;background:var(--mc);opacity:.85}
.mood-row button[aria-pressed="true"]{border-color:var(--mc);background:color-mix(in srgb,var(--mc) 14%,#fff);font-weight:500}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal-h{font-size:11.5px;color:var(--faint);padding-bottom:2px}
.cal-d{position:relative;aspect-ratio:1;border-radius:10px;background:var(--cream);display:grid;place-items:center;font-size:12px;color:var(--sub);overflow:hidden}
.cal-d i{position:absolute;inset:0;background:var(--mc);opacity:.55;border-radius:10px}
.cal-d b{position:relative;z-index:1;font-weight:500}
.cal-d em{position:absolute;right:2px;bottom:0;font-size:9px;font-style:normal;z-index:1}
.cal-d.today{outline:2px solid var(--rose);outline-offset:-2px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--sub)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px;opacity:.75}
/* 心情日記・喝水紀錄 */
:root{--water:#3f8fc0}
button.cal-d{border:0;padding:0;font:inherit;cursor:pointer}
button.cal-d:disabled{opacity:.4;cursor:default}
.cal-d.sel{box-shadow:0 0 0 2px var(--mauve) inset}
.cal-d u{position:absolute;left:4px;top:4px;width:5px;height:5px;border-radius:50%;background:var(--mauve-deep);z-index:1}
.dot-diary{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--mauve-deep);vertical-align:1px;margin-right:2px}
.diary{padding:18px;display:grid;gap:10px}
.day-sum{display:flex;flex-wrap:wrap;gap:8px}
.ds-chip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:99px;background:var(--cream);font-size:13px}
.ds-chip i{width:10px;height:10px;border-radius:50%;background:var(--mc)}
.diary textarea{width:100%;min-height:150px;resize:vertical;border-radius:var(--r-md);border:1px solid var(--line);background:#fffefc;padding:14px 16px;font:inherit;font-size:15px;line-height:1.9;color:var(--ink);background-image:repeating-linear-gradient(transparent 0 calc(1.9em - 1px),#f1e6e1 calc(1.9em - 1px) 1.9em);background-position:0 13px;background-attachment:local}
.diary textarea:focus{outline:2px solid var(--rose);outline-offset:0;border-color:transparent}
.whist{padding:18px;display:grid;gap:12px}
.seg.mini{width:132px}
.seg.mini button{height:30px;font-size:12.5px}
.wstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.wstats div{padding:10px 4px;border-radius:var(--r-sm);background:var(--cream)}
.wstats small{display:block;font-size:11.5px;color:var(--sub)}
.wstats b{font-family:var(--latin);font-size:24px;font-weight:600;font-variant-numeric:lining-nums tabular-nums}
.wstats span{font-size:12px;color:var(--sub);margin-left:2px}
.chart{position:relative}
.chart svg{width:100%;height:auto;display:block;touch-action:pan-y}
.chart .ax{font-size:10px;fill:var(--sub);font-family:var(--sans);font-variant-numeric:tabular-nums}
.chart .base{stroke:var(--line);stroke-width:1}
.chart .goal{stroke:var(--rose);stroke-width:1.2;stroke-dasharray:4 3}
.chart .goal-l{font-size:10.5px;fill:var(--rose)}
.chart .hit{fill:transparent;cursor:pointer}
.chart .hit.on{fill:rgba(63,143,192,.08)}
.tip{position:absolute;top:-8px;transform:translate(-50%,-100%);padding:5px 10px;border-radius:8px;background:var(--mauve-deep);color:#fff;font-size:12px;white-space:nowrap;pointer-events:none}
.wtable{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.wtable th,.wtable td{padding:6px 4px;border-bottom:1px dashed var(--line);text-align:left}
.wtable td.num{text-align:right}
.wtable th:last-child{text-align:right}

/* 徽章 */
.badge-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.badge-card{padding:16px 12px;display:grid;justify-items:center;gap:4px;text-align:center}
.badge-card b{font-family:var(--serif);font-size:15px;margin-top:4px}
.badge-card small{font-size:12px;color:var(--sub)}
.badge-card .progress{width:100%;margin-top:6px}
.badge-card.got{background:linear-gradient(160deg,#fffdf8,#fbf1e2)}
.medal.got{filter:drop-shadow(0 4px 8px rgba(196,154,98,.4))}

.t-qr{position:absolute;right:10px;top:10px;font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);background:#fff;color:var(--mauve-deep)}
.demo a{font-size:11.5px;color:var(--sub);text-decoration:underline;text-underline-offset:3px}

/* 店家核銷頁 */

.staff-head p{margin:2px 0 0}
.staff-card{padding:18px;display:grid;gap:12px}
.staff-err{margin:0;color:#b04a4a;font-size:13px}

.st-sum span{font-size:12px;margin-left:4px}
.st-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.st-badge{display:inline-block;padding:6px 16px;border-radius:99px;font-weight:500;font-size:15px}
.st-badge.ok{background:#e4efe0;color:#4d7a45}
.st-badge.bad{background:#f6e2e0;color:#a24b45}
.st-code{font-family:var(--latin);font-size:19px;font-weight:600;letter-spacing:1.5px;font-variant-numeric:lining-nums}
.st-info{display:grid;grid-template-columns:72px 1fr;gap:6px 10px;margin:0;font-size:14px}
.st-info dt{color:var(--sub)}.st-info dd{margin:0}

.st-check input{width:20px;height:20px;accent-color:var(--mauve)}
.st-rules{margin:0;padding:12px 14px 12px 30px;border-radius:var(--r-sm);font-size:13.5px;line-height:1.8}
.st-rules.ok{background:#eef5eb;color:#3f6a38}
.st-rules.bad{background:#fbeeec;color:#93433d}
.st-log{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.st-log:last-child{border-bottom:0}
.st-log b{font-weight:500;font-size:14px;display:block}
.st-log small{font-size:12px;color:var(--sub)}
.st-log span{font-family:var(--latin);font-size:17px;font-weight:600;color:var(--rose);white-space:nowrap}

.a-card b{font-family:var(--serif);font-size:18px;line-height:1.5;text-wrap:balance}
.a-card small{font-size:12.5px;color:var(--rose)}
.article-wrap{padding-block:18px 8px}
.a-back{margin-bottom:14px}

.a-body p{margin:0 0 14px}

.calc-out{margin:0;font-size:13.5px;line-height:1.7}

details.odds summary{cursor:pointer;font-size:13px;color:var(--sub);text-align:center}

.steps{display:grid;gap:0;counter-reset:s}
.steps div{display:grid;grid-template-columns:34px 1fr;gap:12px;padding:12px 0;position:relative}
.steps div::before{counter-increment:s;content:counter(s);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--cream);color:var(--rose);font-family:var(--latin);font-weight:600;font-size:17px}

.steps p{margin:2px 0 0;font-size:13px;color:var(--sub)}
.friends div{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.friends div:last-child{border-bottom:0}
.pill{padding:2px 10px;border-radius:99px;font-size:12px}

.sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(60,45,55,.42);display:grid;align-items:end;justify-items:center;animation:fade .25s ease}

.nav button{display:grid;justify-items:center;gap:2px;padding:6px 0;border-radius:14px;font-size:11.5px;color:var(--sub);position:relative}
.nav svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--mauve-deep);font-weight:500}
.nav button[aria-current="page"]::before{content:"";position:absolute;top:-9px;width:22px;height:3px;border-radius:3px;background:var(--rose)}
.nav .dot{position:absolute;top:4px;left:calc(50% + 8px);width:8px;height:8px;border-radius:50%;background:var(--rose);border:2px solid var(--paper)}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);z-index:70;padding:10px 18px;border-radius:99px;background:var(--mauve-deep);color:#fff;font-size:14px;opacity:0;transition:.35s;pointer-events:none;white-space:nowrap;max-width:calc(100% - 32px)}

.footer{text-align:center;padding-block:26px 10px}

const tz = 'Asia/Taipei';
function dayKey(t=now()){return new Intl.DateTimeFormat('en-CA',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit'}).format(t)}
function fmtDate(t,opt={month:'numeric',day:'numeric'}){return new Intl.DateTimeFormat('zh-TW',{timeZone:tz,...opt}).format(t)}
function fmtFull(t){return new Intl.DateTimeFormat('zh-TW',{timeZone:tz,year:'numeric',month:'numeric',day:'numeric'}).format(t)}
const c1 = tenths=>(tenths/10).toFixed(1);
function hash(str){let h=2166136261;for(const ch of str){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function genCode(prefix){const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<8;i++)s+=a[Math.floor(Math.random()*a.length)];return prefix+'-'+s.slice(0,4)+'-'+s.slice(4)}

let SERVER=null;
async function api(path,body){
  const opt=body===undefined?{credentials:'same-origin'}:{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify(body)};
  let r;try{r=await fetch('/api/'+path,opt)}catch(e){return {error:'網路連線不穩，請稍後再試'}}
  const j=await r.json().catch(()=>({error:'系統忙碌中，請稍後再試'}));
  if(r.status===401&&path!=='me'){SERVER=null;S.member=null;render();openLogin();}
  return r.ok?j:{error:j.error||'發生錯誤，請稍後再試',status:r.status};
}
function applyServer(st){
  if(!st||!st.member)return;
  SERVER=st;
  S.member={name:st.member.name,code:st.member.refCode,memberCode:st.member.code,picture:st.member.picture,needsProfile:st.member.needsProfile,firstVisit:st.member.firstVisit};
  S.fish=st.fish;
  S.hist=st.hist.map(h=>({at:Date.parse(h.at),d:h.d,label:h.label}));
  S.coupons=st.coupons.map(c=>({code:c.code,kind:c.kind,title:c.title,value:c.value,at:Date.parse(c.at),exp:Date.parse(c.exp),used:c.used,usedAt:c.usedAt?Date.parse(c.usedAt):null,minSpend:c.minSpend}));
  S.streak=st.streak||{n:0,last:''};
  const d=today();d.tasks={};Object.keys(st.today.tasks||{}).forEach(k=>{if(k!=='free_spin')d.tasks[k]=1});d.freeSpin=st.today.freeSpin?1:0;
  S.invites=st.invites||[];
  S.badges=S.badges||{};Object.entries(st.badges||{}).forEach(([m,v])=>{S.badges[m]=Object.assign(S.badges[m]||{},v)});
  save();
}

function qrSvg(text,size){try{const q=qrcode(0,'M');q.addData(text);q.make();return q.createSvgTag({cellSize:Math.max(2,Math.floor(size/(q.getModuleCount()+8))),margin:4,scalable:true})}catch(e){return `<p class="tiny">${esc(text)}</p>`}}
function showQr(title,url,code,note){sheet(`<div style="text-align:center"><b class="h3" style="display:block">${title}</b><div class="qr-box">${qrSvg(url,240)}</div><div class="t-code" style="font-family:var(--latin);font-size:20px;font-weight:600;letter-spacing:2px">${code}</div><p class="muted">${note}</p><button class="btn btn-ghost btn-block" data-close>關閉</button></div>`)}
function activeLots(){const t=now();return S.lots.filter(l=>l.rem>0&&l.exp>t).sort((a,b)=>a.at-b.at)}
function balance(){return SERVER?SERVER.coins:0}
function expiring(){const lim=now()+CONFIG.expireWarnDays*DAY;return activeLots().filter(l=>l.exp<=lim)}
function addCoins(tenths,label,mergeKey){
  const t=now();
  if(mergeKey){
    let lot=S.lots.find(l=>l.mk===mergeKey);
    if(lot){lot.t+=tenths;lot.rem+=tenths;const h=S.hist.find(h=>h.mk===mergeKey);if(h)h.d+=tenths;return}
    S.lots.push({id:'l'+t,t:tenths,rem:tenths,at:t,exp:t+CONFIG.coinLifeDays*DAY,mk:mergeKey});
    S.hist.push({at:t,d:tenths,label,mk:mergeKey});return;
  }
  S.lots.push({id:'l'+t,t:tenths,rem:tenths,at:t,exp:t+CONFIG.coinLifeDays*DAY});
  S.hist.push({at:t,d:tenths,label});
}
function spendCoins(tenths,label){
  if(balance()<tenths)return false;
  let need=tenths;
  for(const l of activeLots()){const u=Math.min(l.rem,need);l.rem-=u;need-=u;if(!need)break}
  S.hist.push({at:now(),d:-tenths,label});return true;
}
function taskState(t){
  const d=today();
  if(d.tasks[t.id])return 'done';
  if(t.id==='checkin')return 'ready';
  if(t.id==='draw')return S.draw&&S.draw.date===dayKey()?'ready':'todo';
  if(t.id==='pet')return d.pets>=t.need?'ready':'todo';
  if(t.id==='breath')return d.breathDone?'ready':'todo';
  if(t.id==='oil')return d.oilDone?'ready':'todo';
  if(t.id==='game')return d.gameDone?'ready':'todo';
  return 'todo';
}
async function claim(id,fromEl){
  if(needLogin())return;
  const t=TASKS.find(x=>x.id===id);const d=today();
  if(d.tasks[id]||taskState(t)!=='ready')return;
  if(fromEl)fromEl.disabled=true;
  const r=await api('claim',{task:id});
  if(r.error){toast(r.error);if(fromEl)fromEl.disabled=false;return}
  applyServer(r.state);
  flyFish(fromEl,Math.min(r.gain,3));
  if(r.bonus)setTimeout(()=>toast(`連續報到 ${r.streak} 天！加送 ${r.bonus} 條小魚乾`),900);
  if(r.added<r.gain)toast('碗滿了！先去小屋餵貓咪吧');else toast(`領到 ${r.gain} 條小魚乾`);
  if(id==='checkin')setTimeout(checkBadges,1200);
  render();
}

const RV_RECENT=(()=>{try{return JSON.parse(localStorage.getItem('heart-rv-recent'))||{}}catch(e){return {}}})();
function pickFresh(slot,arr){
  const used=RV_RECENT[slot]||[];
  const keep=Math.min(used.length,Math.max(0,arr.length-2));
  const pool=arr.map((x,i)=>i).filter(i=>!used.slice(-keep).includes(i));
  const i=pool[Math.floor(Math.random()*pool.length)];
  RV_RECENT[slot]=[...used,i].slice(-8);
  return arr[i];
}
function forGroup(arr,g){return arr.filter(x=>!x.g||(g!=='all'&&x.g.includes(g))).map(x=>x.f)}
function saveRecent(){try{localStorage.setItem('heart-rv-recent',JSON.stringify(RV_RECENT))}catch(e){}}
function joinZh(a){if(a.length<2)return a.join('');return a.slice(0,-1).join('、')+'，還有'+a[a.length-1]}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function rvFeelsFor(){const cats=new Set(RV_SERVICES.filter(x=>RV.svc.includes(x.id)).map(x=>x.cat));return [...RV_FEELS.common,...['breast','preg','body','teach'].filter(c=>cats.has(c)).flatMap(c=>RV_FEELS[c])]}
function genReview(){
  const svcs=RV_SERVICES.filter(x=>RV.svc.includes(x.id));
  if(!svcs.length)return '';
  const nm=svcs.map(x=>x.name);const svcName=nm.length<2?nm[0]:nm.slice(0,-1).join('、')+'和'+nm[nm.length-1];
  const short=pick(nm);
  const st=RV_STAGES.find(x=>x.id===RV.stage)||RV_STAGES[RV_STAGES.length-1];
  const g=st.g;
  const stage=pick(st.lines);
  const chosen=shuffle(rvFeelsFor().filter(f=>RV.feels.includes(f.t)));
  const during=chosen.filter(f=>f.during).map(f=>f.t);
  const after=chosen.filter(f=>!f.during).map(f=>f.t);
  // 各段落
  const P={};
  P.open=stage+pickFresh('open-'+g,forGroup(RV_POOL.open,g))(svcName);
  let own=RV.own.trim();if(own&&!/[。！!？?~～♡]$/.test(own))own+='。';P.own=own;
  let feel='';
  if(during.length)feel+=pick(RV_POOL.during)(during[0]);
  if(after.length)feel+=pickFresh('feel',RV_POOL.feel)(after);else if(feel)feel=feel.replace(/，$/,'。');
  P.feel=feel;
  if(RV.len==='full'){
    const sa=shuffle(RV_STAFF.filter(x=>RV.staff.includes(x)));
    const pa=shuffle(RV_PLACE.filter(x=>RV.place.includes(x)));
    P.staff=sa.length?pickFresh('staff',RV_POOL.staff)(CONFIG.staffName,sa):'';
    P.place=pa.length?pickFresh('place-'+g,forGroup(RV_POOL.place,g))(pa):'';
  }
  P.rec=pickFresh('rec-'+g,forGroup(RV_POOL.rec,g))(short);
  P.close=RV.len==='full'?pick(RV_POOL.close):'';
  // 隨機選一種段落順序，讓每篇的結構都不一樣
  const orders=RV.len==='full'?[
    ['open','own','feel','staff','place','rec','close'],
    ['open','staff','own','feel','place','rec','close'],
    ['own','open','feel','rec','staff','place','close'],
    ['lead','open','own','feel','staff','place','close'],
    ['open','feel','own','place','staff','rec','close']
  ]:[['open','own','feel','rec'],['open','feel','own','rec'],['own','open','feel','rec'],['lead','open','own','feel']];
  let order=pick(orders);
  if(!P.own&&order[0]==='own')order=order.slice(1);
  if(order.includes('lead'))P.lead=pick(RV_POOL.lead);
  let seg=order.map(k=>P[k]).filter(Boolean);
  // 完整版有一半機率分段，讀起來更像真人寫的
  let text;
  if(RV.len==='full'&&seg.length>=4&&Math.random()<.5){const cut=1+Math.floor(Math.random()*(seg.length-2));text=seg.slice(0,cut).join('')+'\n\n'+seg.slice(cut).join('')}
  else text=seg.join('');
  text=text.replace(/。。/g,'。');
  // 偶爾把一個句號換成驚嘆號、結尾加一個小表情
  if(Math.random()<.35){const idx=[...text.matchAll(/。/g)].map(m=>m.index);if(idx.length>1){const i=idx[Math.floor(Math.random()*(idx.length-1))];text=text.slice(0,i)+'！'+text.slice(i+1)}}
  if(Math.random()<.35)text=text.replace(/\s*$/,'')+pick(RV_EMOJI);
  saveRecent();
  return text;
}
function newReview(){let t='',i=0;do{t=genReview();i++}while(t===RV.text&&i<12);RV.text=t;RV.edited=false}

let breathTimer=null;
function viewTasks(){
  const d=today(), done=TASKS.filter(t=>d.tasks[t.id]).length, frac=done/TASKS.length;
  const C=2*Math.PI*44;
  const filled=S.streak.n>0&&S.streak.n%7===0?7:S.streak.n%7;
  const days=[];for(let i=0;i<7;i++)days.push(i<filled?'on':'');
  return sky('Little tasks','今日任務','照顧自己的小事，做完就能換小魚乾。',done===TASKS.length?pick(CAT_LINES.tasksDone):pick(CAT_LINES.tasks))+`
  <div class="gutter stack" style="margin-top:-12px;position:relative;z-index:3">
    <section class="card ring-wrap">
      <div class="ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="none" stroke="var(--blush)" stroke-width="8"/><circle cx="50" cy="50" r="44" fill="none" stroke="var(--rose)" stroke-width="8" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-frac)}" style="transition:stroke-dashoffset .8s"/></svg>
        <div class="val"><b class="num">${done}/${TASKS.length}</b><small>今日完成</small></div></div>
      <div><b class="h3">連續報到 ${S.streak.n} 天</b><div class="muted">每滿 7 天，貓咪多送 ${CONFIG.streakBonusFish} 條小魚乾</div>
        <div class="streak" aria-label="本週報到">${days.map((c,i)=>`<span class="${c} ${i===6&&!c?'gift':''}">${i===6?'禮':i+1}</span>`).join('')}</div></div>
    </section>
    <div class="tasks">${TASKS.map(t=>{const st=taskState(t);const prog=t.need?Math.min(d.pets,t.need):0;
      const btn= st==='done'?`<button class="task-btn ok" disabled>已領取 ✓</button>`
        : st==='ready'?`<button class="task-btn claim" data-claim="${t.id}">領取</button>`
        : t.id==='oil'?`<span class="btn-pair"><button class="task-btn" data-video="general">看示範</button><button class="task-btn" data-oil>我做好了</button></span>`
        : t.id==='breath'?`<button class="task-btn" data-breath>開始</button>`
        : `<button class="task-btn" data-go="${t.go}">去做</button>`;
      return `<div class="task ${st==='done'?'done':''}"><span class="ic"><svg viewBox="0 0 24 24">${t.icon}</svg></span><div><b>${t.name}</b><small>${t.desc}</small>
        <span class="reward">${fishSvg(15)} ×${t.fish}</span>${t.need&&st==='todo'?`<div class="mini-prog"><i style="width:${prog/t.need*100}%"></i></div>`:''}</div>${btn}</div>`}).join('')}</div>
    <section class="card breath" id="breathBox" hidden>
      <div class="orbit" id="orbit"><div><b class="num" id="bSec">60</b><span id="bLabel">準備好了嗎</span></div></div>
      <p class="muted" id="bCue" style="margin:0">坐著或躺著都可以，一手放在胸口，一手放在肚子上。</p>
      <button class="btn btn-ghost" id="bStop">先停下來</button>
    </section>
    <p class="tiny" style="text-align:center">每天以台灣時間 00:00 換日・每項任務每天可領一次</p>
  </div>`;
}

/* ---------- 音效（用瀏覽器即時合成，不需要額外檔案） ---------- */
let AC=null,NOISE=null;
function ac(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return null}
    const len=AC.sampleRate*2;NOISE=AC.createBuffer(1,len,AC.sampleRate);const d=NOISE.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1}
  if(AC.state==='suspended')AC.resume();
  return AC;
}
function noiseHit(t,dur,freq,q,gain){
  const c=AC,src=c.createBufferSource();src.buffer=NOISE;src.playbackRate.value=.8+Math.random()*.4;
  const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;f.Q.value=q;
  const g=c.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(gain,t+.004);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  src.connect(f).connect(g).connect(c.destination);src.start(t,Math.random()*1.5);src.stop(t+dur+.02);
}
function tone(t,freq,dur,gain,type='sine',glide){
  const c=AC,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);
  if(glide)glide(o.frequency,t);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(gain,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(c.destination);o.start(t);o.stop(t+dur+.05);
}
function sfx(kind){
  if(!S.sound)return;const c=ac();if(!c)return;const t=c.currentTime+.01;
  if(kind==='riffle'){for(let i=0;i<9;i++)noiseHit(t+i*.016+Math.random()*.006,.03,2600+Math.random()*1400,1.2,.22)}
  else if(kind==='tick'){noiseHit(t,.04,3200,1.5,.25)}
  else if(kind==='spread'){for(let i=0;i<DECK_N;i++)noiseHit(t+i*.045,.05,2200+i*60,1.4,.16)}
  else if(kind==='flip'){noiseHit(t,.18,1400,.7,.25);[880,1320,1760].forEach((f,i)=>tone(t+.25+i*.09,f,1.2,.06))}
  else if(kind==='meow'){
    // 「喵～」：鋸齒波經過兩個共振峰濾波，音高先上揚再落下，加一點顫音
    const dur=.55+Math.random()*.2,base=480+Math.random()*120;
    const o=c.createOscillator();o.type='sawtooth';
    o.frequency.setValueAtTime(base,t);o.frequency.linearRampToValueAtTime(base*1.55,t+dur*.3);o.frequency.linearRampToValueAtTime(base*1.15,t+dur);
    const vib=c.createOscillator(),vg=c.createGain();vib.frequency.value=6;vg.gain.value=10;vib.connect(vg).connect(o.frequency);
    const f1=c.createBiquadFilter();f1.type='bandpass';f1.Q.value=6;f1.frequency.setValueAtTime(700,t);f1.frequency.linearRampToValueAtTime(1100,t+dur*.35);f1.frequency.linearRampToValueAtTime(800,t+dur);
    const f2=c.createBiquadFilter();f2.type='bandpass';f2.Q.value=8;f2.frequency.setValueAtTime(1800,t);f2.frequency.linearRampToValueAtTime(2400,t+dur*.35);f2.frequency.linearRampToValueAtTime(1900,t+dur);
    const g1=c.createGain(),g2=c.createGain();g2.gain.value=.5;
    const env=c.createGain();env.gain.setValueAtTime(0,t);env.gain.linearRampToValueAtTime(.32,t+.06);env.gain.setValueAtTime(.28,t+dur*.6);env.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(f1).connect(g1).connect(env);o.connect(f2).connect(g2).connect(env);env.connect(c.destination);
    o.start(t);vib.start(t);o.stop(t+dur+.05);vib.stop(t+dur+.05);
  }
  else if(kind==='purr'){
    const src=c.createBufferSource();src.buffer=NOISE;const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=180;
    const amp=c.createGain();amp.gain.value=0;const lfo=c.createOscillator();lfo.frequency.value=24;const lg=c.createGain();lg.gain.value=.5;
    lfo.connect(lg).connect(amp.gain);const out=c.createGain();out.gain.setValueAtTime(0,t);out.gain.linearRampToValueAtTime(.9,t+.15);out.gain.linearRampToValueAtTime(.0001,t+1.3);
    src.connect(f).connect(amp).connect(out).connect(c.destination);src.start(t);lfo.start(t);src.stop(t+1.4);lfo.stop(t+1.4);
  }
}

function startRitual(){

  const deck=$('#deck'),cards=[...deck.querySelectorAll('.tcard')],btn=$('#shuffleBtn'),hint=$('#deckHint');
  btn.disabled=true;btn.textContent='洗牌中…';hint.innerHTML='貓咪正在幫妳把心意洗進牌裡…';

/* 真實洗牌：切牌 → 鳩尾洗牌（左右交錯落下）→ 整牌，重複兩次，最後再切一次牌 */
const stackT=(j,x=0,y=0,r=0)=>`translate(${x+j*.35}px,${y-j*.7}px) rotate(${r}deg)`;
function move(el,to,dur,delay=0,mid,ease='cubic-bezier(.3,.7,.3,1)'){
  return new Promise(res=>{
    const from=el.style.transform||'none';
    const kf=mid?[{transform:from},{transform:mid,offset:.45},{transform:to}]:[{transform:from},{transform:to}];
    const an=el.animate(kf,{duration:dur,delay,easing:ease,fill:'both'});
    an.onfinish=()=>{el.style.transform=to;an.cancel();res()};
  });
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function riffleSequence(deck,cards){
  let order=cards.slice();
  order.forEach((c,j)=>{c.style.zIndex=j;c.style.transform=stackT(j)});
  for(let round=0;round<2;round++){
    // 1. 切成左右兩疊，微微往內傾
    const half=Math.floor(order.length/2)+(Math.random()<.5?0:1);
    const L=order.slice(0,half),R=order.slice(half);
    sfx('tick');
    await Promise.all([
      ...L.map((c,k)=>move(c,stackT(k,-78,6,-9),340,k*10)),
      ...R.map((c,k)=>move(c,stackT(k,78,6,9),340,k*10))
    ]);
    await wait(120);
    // 2. 兩疊的牌輪流落下，交錯疊回中間
    const next=[];let li=0,ri=0;
    while(li<L.length||ri<R.length){
      const takeL=ri>=R.length||(li<L.length&&(next.length%2===0?Math.random()<.65:Math.random()<.35));
      next.push(takeL?L[li++]:R[ri++]);
    }
    const ps=next.map((c,j)=>{const fromLeft=L.includes(c);
      setTimeout(()=>{c.style.zIndex=j;if(j%2===0)sfx('riffle')},j*55);
      return move(c,stackT(j,0,0,(Math.random()*3-1.5)),300,j*55,stackT(j,fromLeft?-30:30,-22,fromLeft?-4:4),'cubic-bezier(.4,.1,.3,1)');
    });
    await Promise.all(ps);
    // 3. 整牌：把牌敲齊，整疊輕輕彈一下
    await Promise.all(next.map((c,j)=>move(c,stackT(j),180)));
    deck.animate([{transform:'translateY(0)'},{transform:'translateY(-8px)'},{transform:'translateY(0)'}],{duration:260,easing:'ease-out'});
    sfx('tick');
    order=next;await wait(200);
  }
  // 4. 最後切一次牌：上半疊拿起，放到下面
  const half=Math.floor(order.length/2),top=order.slice(half),bottom=order.slice(0,half);
  await Promise.all(top.map((c,k)=>move(c,stackT(k+half,92,-40,6),320,k*8)));
  await Promise.all(bottom.map((c,k)=>move(c,stackT(k,-10,0,0),220)));
  top.forEach((c,k)=>{c.style.zIndex=k});bottom.forEach((c,k)=>{c.style.zIndex=k+top.length});
  sfx('tick');
  await Promise.all([...top.map((c,k)=>move(c,stackT(k),300,k*8)),...bottom.map((c,k)=>move(c,stackT(k+top.length),300))]);
  order=[...top,...bottom];
  // 依新順序重新排列 DOM，攤牌時順序就是洗過的順序
  order.forEach((c,j)=>{c.style.zIndex=j;deck.appendChild(c);c.dataset.pick=j});
}
function spreadDeck(){
  const deck=$('#deck'),cards=[...deck.querySelectorAll('.tcard')];
  deck.classList.remove('shuffling');void deck.offsetWidth;
  $('#rs3').classList.add('on');
  const span=17;sfx('spread');
  cards.forEach((c,i)=>{const a=-span+(2*span)*i/(DECK_N-1);c.style.transitionDelay=(i*45)+'ms';c.style.transform=`rotate(${a}deg)`;c.style.zIndex=i;c.tabIndex=0});
  setTimeout(()=>{cards.forEach(c=>c.style.transitionDelay='0ms');deck.classList.add('spread');ritualBusy=false;
    $('#deckHint').innerHTML='憑直覺，選一張最吸引妳的牌。';catSay('慢慢看，哪一張在跟妳打招呼？');
    const btn=$('#shuffleBtn');btn.disabled=false;btn.textContent='重新洗牌';btn.classList.replace('btn-primary','btn-ghost');
    btn.onclick=()=>{deck.classList.remove('spread');cards.forEach((c,i)=>{c.tabIndex=-1;c.style.transform=`translate(${i*.4}px,${-i*.6}px)`});setTimeout(startRitual,450)};
  },DECK_N*45+500);
}

  $('#chipCoin').textContent=c1(res.state.coins);

  const n=WHEEL.prizes.length,segA=360/n;
  const start=wheelRot,base=start-(start%360);

  const svg=$('#wheelSvg'),dur=4600,t0=performance.now();let lastSeg=Math.floor((start+segA/2)/segA);

function bestCoupons(amount){
  const n=Math.floor((amount||0)/CONFIG.couponPerNTD);
  const valid=S.coupons.filter(c=>c.kind!=='gift'&&!c.used&&c.exp>now()).sort((a,b)=>b.value-a.value);
  // 找出不超過可用張數與折抵上限、金額最高的組合（金額相同時用比較少張）
  const pool=valid.slice(0,16);let best={pick:[],total:0};
  const dfs=(i,cur,tot)=>{
    if(tot>best.total||(tot===best.total&&cur.length<best.pick.length))best={pick:cur.slice(),total:tot};
    if(i>=pool.length||cur.length>=n)return;
    for(let j=i;j<pool.length;j++){const v=pool[j].value;if(tot+v<=CONFIG.maxDiscountNTD){cur.push(pool[j]);dfs(j+1,cur,tot+v);cur.pop()}}
  };
  dfs(0,[],0);
  return {n,pick:best.pick,total:best.total};
}
function calcText(amount){
  if(!amount)return `輸入金額，看看這次最多可以用幾張、折多少。`;
  const r=bestCoupons(amount);
  if(r.n===0)return `消費滿 NT$${CONFIG.couponPerNTD.toLocaleString()} 才能使用折價券，還差 NT$${(CONFIG.couponPerNTD-amount).toLocaleString()}。`;
  if(!r.pick.length)return `這次最多可用 ${r.n} 張，但妳目前沒有可用的折價券。`;
  return `這次最多可用 <b>${r.n}</b> 張（每筆最多折抵 NT$${CONFIG.maxDiscountNTD}）。建議使用 ${r.pick.map(c=>'NT$'+c.value).join(' + ')}，共折抵 <b>NT$${r.total}</b>，實付 <b>NT$${(amount-r.total).toLocaleString()}</b>。`;
}

        <span class="m-face m-front" style="--mc:${pr.color}">${c.type==='prod'?bottleSvg(pr.color):leafSvg(pr.color)}<b>${c.type==='prod'?pr.prod:pr.ing}</b><small>${c.type==='prod'?'漢芳療':'代表香氣'}</small></span></span></button>`}).join('')}</div>
    <section class="card fact" id="gFact" ${lastPair?'':'hidden'}>${lastPair?factHtml(lastPair):''}</section>
    ${G.done?`<section class="card play-done"><div class="stars">${[1,2,3].map(n=>`<span class="${n<=stars?'on':''}">★</span>`).join('')}</div>
      <b class="h3">${G.moves} 步完成！${stars===3?'妳是香氣達人':stars===2?'記性很好喔':'越玩越熟悉'}</b>
      <p class="muted" style="margin:0">${d.tasks.game?'今天的小魚乾已經領過了，可以繼續玩、挑戰最佳紀錄。':'到「今日任務」領取 2 條小魚乾吧！'}</p>
      <div class="rv-btns"><button class="btn btn-ghost" id="gAgain">再玩一局</button><button class="btn btn-primary" data-go="tasks">去領小魚乾</button></div></section>`:''}
    <p class="tiny" style="text-align:center">今天玩了 ${d.games||0} 局・本月 ${monthCount('games')} 局</p>
  </div>`;
}
function factHtml(pr){return `<div class="fact-head">${bottleSvg(pr.color)}<div><span class="pr-tag" style="background:${pr.color}">配對成功</span><b>${pr.prod} × ${pr.ing}</b></div></div><p>${pr.fact}</p>`}
function flipMatch(i){
  if(!G||G.lock||G.done)return;const c=G.cards[i];
  if(G.open.includes(i)||G.matched.has(c.pid))return;
  ac();sfx('tick');
  G.open.push(i);const el=document.querySelector(`[data-m="${i}"]`);el.classList.add('on');
  if(G.open.length<2)return;
  G.moves++;$('#gMoves').textContent=G.moves;
  const [a,b]=G.open.map(x=>G.cards[x]);
  if(a.pid===b.pid){
    G.matched.add(a.pid);G.open=[];G.last=a.pid;
    document.querySelectorAll(`.mcard`).forEach(m=>{const k=+m.dataset.m;if(G.cards[k].pid===a.pid)m.classList.add('got')});
    $('#gPairs').textContent=`${G.matched.size} / ${MATCH_PAIRS.length}`;
    const f=$('#gFact');f.hidden=false;f.innerHTML=factHtml(MATCH_PAIRS.find(x=>x.id===a.pid));f.classList.remove('pop');void f.offsetWidth;f.classList.add('pop');
    sfx('flip');
    if(G.matched.size===MATCH_PAIRS.length){
      G.done=true;const d=today();d.games=(d.games||0)+1;d.gameDone=true;
      if(!S.bestMoves||G.moves<S.bestMoves)S.bestMoves=G.moves;
      save();setTimeout(()=>{const y=scrollY;render();window.scrollTo(0,y);checkBadges()},900);
    }
  }else{
    G.lock=true;
    setTimeout(()=>{G.open.forEach(x=>{const m=document.querySelector(`[data-m="${x}"]`);if(m)m.classList.remove('on')});G.open=[];G.lock=false},850);
  }
}

function waterHistory(){
  const goal=S.waterGoal||8,n=waterRange,t=now();
  const days=Array.from({length:n},(_,i)=>{const k=dayKey(t-(n-1-i)*DAY);return {k,v:((S.days||{})[k]||{}).water||0}});
  const logged=days.filter(d=>d.v>0);
  const avg=logged.length?(logged.reduce((a,d)=>a+d.v,0)/logged.length):0;
  const hit=days.filter(d=>d.v>=goal).length;
  let best=0,run=0;days.forEach(d=>{run=d.v>=goal?run+1:0;best=Math.max(best,run)});
  // chart geometry
  const W=340,H=168,L=26,R=8,T=14,B=26,pw=W-L-R,ph=H-T-B;
  const max=Math.max(goal+2,...days.map(d=>d.v));
  const step=pw/n,bw=Math.max(3,step-2);
  const yv=v=>T+ph-(v/max)*ph;
  const gy=yv(goal);
  const lbl=(d,i)=>{const [,mm,dd]=d.k.split('-').map(Number);if(n===7)return `${mm}/${dd}`;return (i%5===0||i===n-1)?`${mm}/${dd}`:''};
  const bars=days.map((d,i)=>{const x=L+i*step+(step-bw)/2,h=Math.max(0,T+ph-yv(d.v));
    const r=Math.min(4,bw/2,h);
    const path=h>0?`M${x},${T+ph} V${T+ph-h+r} Q${x},${T+ph-h} ${x+r},${T+ph-h} H${x+bw-r} Q${x+bw},${T+ph-h} ${x+bw},${T+ph-h+r} V${T+ph} Z`:'';
    return `${path?`<path d="${path}" fill="var(--water)" opacity="${d.v>=goal?1:.55}"/>`:''}
      <rect class="hit" x="${L+i*step}" y="${T}" width="${step}" height="${ph}" data-tip="${lbl({k:d.k},0)||d.k.slice(5).replace('-','/')}・${d.v} 杯${d.v>=goal?'（達標）':''}" data-x="${L+i*step+step/2}"/>
      <text x="${L+i*step+step/2}" y="${H-8}" text-anchor="middle" class="ax">${lbl(d,i)}</text>`}).join('');
  return `<section class="card whist">
    <div class="rv-q"><b>喝水紀錄</b><div class="seg mini" role="group" aria-label="顯示天數"><button data-wr="7" aria-pressed="${n===7}">7 天</button><button data-wr="30" aria-pressed="${n===30}">30 天</button></div></div>
    <div class="wstats">
      <div><small>平均每天</small><b class="num">${avg?avg.toFixed(1):'—'}</b><span>杯</span></div>
      <div><small>達標天數</small><b class="num">${hit}</b><span>/ ${n} 天</span></div>
      <div><small>最長連續達標</small><b class="num">${best}</b><span>天</span></div>
    </div>
    <div class="chart" id="wChart">
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="最近 ${n} 天每天喝水杯數的長條圖，目標 ${goal} 杯">
        <line x1="${L}" x2="${W-R}" y1="${T+ph}" y2="${T+ph}" class="base"/>
        <text x="${L-6}" y="${T+ph+4}" text-anchor="end" class="ax">0</text>
        ${bars}
        <line x1="${L}" x2="${W-R}" y1="${gy}" y2="${gy}" class="goal"/>
        <text x="${L-6}" y="${gy+4}" text-anchor="end" class="ax">${goal}</text>
        <text x="${W-R}" y="${gy-5}" text-anchor="end" class="goal-l">目標 ${goal} 杯</text>
      </svg>
      <div class="tip" id="wTip" hidden></div>
    </div>
    <details class="odds"><summary>用表格看</summary><table class="wtable"><thead><tr><th>日期</th><th>杯數</th></tr></thead><tbody>${days.slice().reverse().map(d=>`<tr><td>${d.k.slice(5).replace('-','/')}</td><td class="num">${d.v}${d.v>=goal?' ✓':''}</td></tr>`).join('')}</tbody></table></details>
  </section>`;
}

const BADGE_REWARD_FISH=5;
function monthBadges(mk=monthKey()){const got=(S.badges||{})[mk]||{};return BADGES.map(b=>({...b,done:!!got[b.id],v:mk===monthKey()?b.val():(got[b.id]?b.need:0)}))}
function medalSvg(b,size=56){
  const c=b.done?b.color:'#d8cfcc';
  return `<svg class="medal ${b.done?'got':''}" width="${size}" height="${size}" viewBox="0 0 48 48" aria-hidden="true"><path d="M15 2h7l3 10-6 3ZM33 2h-7l-3 10 6 3Z" fill="${b.done?'#d98f9a':'#e6dcd9'}"/><circle cx="24" cy="29" r="16" fill="${c}"/><circle cx="24" cy="29" r="12.5" fill="none" stroke="#fff" stroke-opacity=".6" stroke-dasharray="1.5 2"/><g transform="translate(12 17)"><path d="${b.icon}" fill="#fff" fill-opacity="${b.done?1:.7}"/></g></svg>`;
}
async function checkBadges(){
  if(!SERVER)return;
  const mk=monthKey();S.badges=S.badges||{};S.badges[mk]=S.badges[mk]||{};
  const b=BADGES.find(x=>!S.badges[mk][x.id]&&x.val()>=x.need);
  if(!b)return;
  const r=await api('badge',{id:b.id});
  if(r.error){if(r.status===409){S.badges[mk][b.id]=1;save()}return}
  applyServer(r.state);S.badges[mk][b.id]=1;save();sfx('flip');
  sheet(`<div style="text-align:center">${medalSvg({...b,done:true},110)}<b class="h2" style="display:block;font-size:21px;margin-top:8px">獲得徽章「${b.name}」！</b><p class="muted">${b.desc}，好厲害！貓咪送妳 ${BADGE_REWARD_FISH} 條小魚乾。</p><button class="btn btn-primary btn-block" data-close>收下徽章</button></div>`);
  if(route==='badges'||route==='home'){const y=scrollY;render();window.scrollTo(0,y)}
}

function viewBadges(){

function couponStatus(c){if(!c)return 'none';if(c.used)return 'used';if(c.exp<now())return 'expired';return 'valid'}
function staffCheck(c){
  if(c.kind==='gift')return {ok:true,lines:[`到店領取${c.cash?`，請收加價 NT$${c.cash}`:'，免加價'}`]};
  const amt=parseInt(staffAmt)||0,lines=[];let ok=true;
  if(!amt){return {ok:false,lines:['請先輸入這次的消費金額']}}
  const allow=Math.floor(amt/CONFIG.couponPerNTD);
  const usedToday=(S.redeemLog||[]).filter(r=>r.day===dayKey()&&r.amt===amt&&r.kind!=='gift');
  const usedSum=usedToday.reduce((a,r)=>a+r.value,0);
  if(allow<1){ok=false;lines.push(`消費未滿 NT$${CONFIG.couponPerNTD.toLocaleString()}，不能使用折價券`)}
  else lines.push(`這筆消費可使用 ${allow} 張折價券`);
  if(usedToday.length>=allow&&allow>0){ok=false;lines.push(`這筆消費已經用了 ${usedToday.length} 張，達到可用張數`)}
  if(usedSum+c.value>CONFIG.maxDiscountNTD){ok=false;lines.push(`加上這張會超過單筆折抵上限 NT$${CONFIG.maxDiscountNTD}（已折 NT$${usedSum}）`)}
  if(staffBday){ok=false;lines.push('這筆消費已使用生日優惠，折價券不能同時使用')}
  if(ok)lines.push(`可以折抵 NT$${c.value}，實收 NT$${(amt-usedSum-c.value).toLocaleString()}`);
  return {ok,lines};
}

    <p class="tiny" style="text-align:center">示範版只能查到這支手機裡的折扣碼；正式版會連到雲端，查得到所有客人的折扣碼。</p>

function render(nav){
  stopBreath(false);
  const views={home:viewHome,cards:viewCards,tasks:viewTasks,cat:viewCat,coins:viewCoins,invite:viewInvite,review:viewReview,play:viewPlay,mom:viewMom,badges:viewBadges,articles:viewArticles};
  const main=$('#main');
  main.innerHTML=`<div class="page">${views[route]()}</div>`;
  $('#chipCoin').textContent=c1(balance());
  $('#chipFish').textContent=S.fish;
  document.querySelectorAll('.nav button').forEach(b=>{const on=b.dataset.go===route||(route==='invite'&&b.dataset.go==='coins')||(['review','play','mom','badges','articles','staff'].includes(route)&&b.dataset.go==='home');on?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current')});
  $('#dotCards').hidden=!!(S.draw&&S.draw.date===dayKey());
  $('#dotTasks').hidden=!TASKS.some(t=>taskState(t)==='ready');
  if(nav){window.scrollTo({top:0,behavior:'instant'});const h=$('#pageTitle');if(h)h.focus({preventScroll:true})}
  bind();
}

function bind(){

    const last=S.draw&&S.draw.date===dayKey()?S.draw.card:-1;

    const d=today();d.pets++;save();
    const house=$('#house');house.classList.remove('purr');void house.offsetWidth;house.classList.add('purr');
    const r=house.getBoundingClientRect();const h=document.createElement('span');h.className='float';h.textContent='♡';
    h.style.left=(e.clientX-r.left-10)+'px';h.style.top=(e.clientY-r.top-20)+'px';house.appendChild(h);setTimeout(()=>h.remove(),1200);
    $('#houseTalk').textContent=pick(CAT_LINES.pet);
    $('#petCount').textContent=d.pets;
    if(S.sound){ac();const a=$('#purr');let ok=false;try{a.currentTime=0;const pr=a.play();if(pr)pr.then(()=>{ok=true},()=>sfx('purr'));else ok=true}catch(err){sfx('purr')}

  const sb=$('#soundBtn');if(sb)sb.onclick=()=>{S.sound=!S.sound;save();sb.textContent='呼嚕聲：'+(S.sound?'開':'關');sb.setAttribute('aria-pressed',S.sound)};

  document.querySelectorAll('[data-login]').forEach(b=>b.onclick=()=>openLogin());
  const mq=$('[data-memberqr]');if(mq)mq.onclick=()=>showQr('我的會員卡',location.origin+'/staff.html?m='+S.member.memberCode,S.member.memberCode,'到店時請芯彤掃這個 QR Code');
  document.querySelectorAll('[data-couponqr]').forEach(b=>b.onclick=()=>showQr('折扣碼',location.origin+'/staff.html?c='+b.dataset.couponqr,b.dataset.couponqr,'結帳時請芯彤掃這個 QR Code'));
  document.querySelectorAll('[data-article]').forEach(b=>b.onclick=()=>{articleId=b.dataset.article||null;render(true)});
  document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>flipMatch(+b.dataset.m));
  const ga=$('#gAgain');if(ga)ga.onclick=()=>{newGame();render(true)};
  document.querySelectorAll('[data-decor]').forEach(b=>b.onclick=()=>{S.decor=S.decor||{};S.decor[b.dataset.decor]=!S.decor[b.dataset.decor];save();const y=scrollY;render();window.scrollTo(0,y)});
  document.querySelectorAll('[data-cup]').forEach(b=>b.onclick=()=>{const d=today(),i=+b.dataset.cup,goal=S.waterGoal||8;const was=d.water||0;d.water=(i<was)?i:i+1;save();ac();sfx('tick');
    if(was<goal&&d.water>=goal){toast('今天喝水達標了！');setTimeout(checkBadges,600)}const y=scrollY;render();window.scrollTo(0,y)});

  document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{momDay=b.dataset.day;const y=scrollY;render();window.scrollTo(0,y);const dd=$('.diary');if(dd)dd.scrollIntoView({behavior:'smooth',block:'nearest'})});

  document.querySelectorAll('[data-wr]').forEach(b=>b.onclick=()=>{waterRange=+b.dataset.wr;const y=scrollY;render();window.scrollTo(0,y)});
  const wc=$('#wChart');if(wc){const tip=$('#wTip');const show=e=>{const r=e.target.closest('.hit');if(!r){tip.hidden=true;return}const box=wc.getBoundingClientRect(),sv=wc.querySelector('svg').getBoundingClientRect();tip.textContent=r.dataset.tip;tip.hidden=false;const x=(+r.dataset.x/340)*sv.width;tip.style.left=Math.max(40,Math.min(box.width-40,x))+'px';wc.querySelectorAll('.hit').forEach(h=>h.classList.toggle('on',h===r))};
    wc.addEventListener('pointermove',show);wc.addEventListener('pointerdown',show);wc.addEventListener('pointerleave',()=>{tip.hidden=true;wc.querySelectorAll('.hit').forEach(h=>h.classList.remove('on'))})}
  document.querySelectorAll('[data-mood]').forEach(b=>b.onclick=()=>{const d=today();d.mood=b.dataset.mood;save();const y=scrollY;render();window.scrollTo(0,y)});
  document.querySelectorAll('[data-gift]').forEach(b=>b.onclick=()=>openGift(b.dataset.gift,+b.dataset.way));
  const sa=$('#spendAmt');if(sa)sa.oninput=()=>{const v=parseInt(sa.value.replace(/[^0-9]/g,''))||0;S.spendAmt=v;save();$('#calcOut').innerHTML=calcText(v)};

  // review
  document.querySelectorAll('[data-rv]').forEach(b=>b.onclick=()=>{
    const g=b.dataset.rv,v=b.dataset.val;
    if(g==='stage')RV.stage=v;
    else{const arr=RV[g];const i=arr.indexOf(v);i>=0?arr.splice(i,1):arr.push(v);if(g==='svc'&&!arr.length)arr.push(v)}

  const rn=$('#rvNew');if(rn)rn.onclick=()=>{const y=scrollY;newReview();render();window.scrollTo(0,y);toast('換好新的一版了')};
  const rc=$('#rvCopy');if(rc)rc.onclick=()=>{const t=$('#rvText');

function selectText(el){const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r)}

async function feed(n,btn){
  if(needLogin())return;
  if(!S.fish){$('#houseTalk').textContent=pick(CAT_LINES.feedEmpty);return}
  n=Math.min(n,S.fish);if(btn)btn.disabled=true;
  const r=await api('feed',{n});
  if(r.error){toast(r.error);if(btn)btn.disabled=false;return}
  today().fed=(today().fed||0)+n;
  flyTo(btn,$('#petCat'),'fish',Math.min(n,4));
  setTimeout(()=>{
    const house=$('#house');if(house){house.classList.remove('purr');void house.offsetWidth;house.classList.add('purr');$('#houseTalk').textContent=pick(CAT_LINES.feed)}
    flyTo($('#petCat'),$('.wallet-chip'),'coin',Math.min(n,3));
    setTimeout(()=>{applyServer(r.state);toast(`貓咪吃了 ${n} 條，存入 ${c1(n*CONFIG.coinTenthsPerFeed)} 芯幣`);render()},900);
  },700);
}

function flyTo(from,to,sym,count){
  if(!from||!to)return;
  const a=from.getBoundingClientRect(),b=to.getBoundingClientRect();
  for(let i=0;i<count;i++){
    const el=document.createElementNS('http://www.w3.org/2000/svg','svg');el.setAttribute('class','fly');
    el.innerHTML=`<use href="#${sym}"/>`;
    el.style.left=(a.left+a.width/2-14+(i-count/2)*10)+'px';el.style.top=(a.top+a.height/2-14)+'px';
    document.body.appendChild(el);
    setTimeout(()=>{el.style.transform=`translate(${b.left+b.width/2-(a.left+a.width/2)}px,${b.top+b.height/2-(a.top+a.height/2)}px) scale(.6)`;el.style.opacity='.2'},30+i*90);
    setTimeout(()=>el.remove(),1000+i*90);
  }
}
function flyFish(from,count){flyTo(from,$('.wallet-chip'),'fish',count)}

/* 呼吸 1 分鐘 */
function startBreath(){
  const box=$('#breathBox');box.hidden=false;box.scrollIntoView({behavior:'smooth',block:'center'});
  const orbit=$('#orbit');let left=60,phaseT=0;
  const phases=[['鼻子吸氣・肚子鼓起',4,1],['輕輕停住',2,1],['嘴巴吐氣・肚子收回',6,.7]];let p=0;
  const cues=['吸氣時，讓肚子像氣球一樣慢慢鼓起來。','吐氣時，肚子慢慢往內收，像在吹涼一杯熱茶。','胸口的手盡量不動，只讓肚子上的手起伏。','肩膀放鬆，如果覺得不舒服，就回到自然的呼吸。'];
  const tick=()=>{
    if(phaseT<=0){const ph=phases[p%3];$('#bLabel').textContent=ph[0];orbit.style.setProperty('--s',ph[2]);orbit.style.setProperty('--d',ph[1]+'s');phaseT=ph[1];p++}
    $('#bSec').textContent=left;
    if(left%15===0)$('#bCue').textContent=cues[(60-left)/15%cues.length];
    left--;phaseT--;
    if(left<0){stopBreath(false);today().breathDone=true;save();toast('腹式呼吸完成！可以領 2 條小魚乾了');render()}
  };
  tick();breathTimer=setInterval(tick,1000);
}
function stopBreath(rerender){if(breathTimer){clearInterval(breathTimer);breathTimer=null;if(rerender)render()}}

/* 兌換確認 sheet */
function openRedeem(n){
  if(!n)return;
  sheet(`<b class="h3" style="display:block;text-align:center">確認兌換</b>
    <div style="text-align:center;margin:16px 0"><div style="font-family:var(--latin);font-size:42px;font-weight:600">${coinSvg(36)} ${n}</div><div class="muted">兌換 NT$${n*CONFIG.coinValueNTD} 折抵券・${CONFIG.redeemCodeDays} 天內到店使用</div></div>
    <div class="row" style="flex-wrap:nowrap"><button class="btn btn-ghost" style="flex:1" data-close>再想想</button><button class="btn btn-primary" style="flex:1" id="confirmRedeem">確認兌換</button></div>`);
  $('#confirmRedeem').onclick=async()=>{
    const b=$('#confirmRedeem');b.disabled=true;
    const r=await api('redeem',{coins:n});
    if(r.error){toast(r.error);b.disabled=false;return}
    applyServer(r.state);redeemPick=null;closeSheet();render();toast('兌換成功！到店時出示折扣碼');
  };
}

let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2400)}

$('#logoutBtn').onclick=async()=>{await api('logout',{});SERVER=null;S.member=null;S.coupons=[];S.hist=[];S.fish=0;save();render();toast('已登出')};

// 啟動
(async function start(){
  const q=new URLSearchParams(location.search);
  const ref=(q.get('ref')||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(ref){try{sessionStorage.setItem('hc_ref',ref)}catch(e){};history.replaceState(null,'',location.pathname+location.hash)}
  const h=location.hash.slice(1);
  route=ROUTES.includes(h)?h:'home';
  render();
  const me=await api('me');
  if(me&&me.member){applyServer(me);$('#logoutBtn').hidden=false;render();
    if(me.member.needsProfile||h==='profile'){openProfile();return}
    setTimeout(maybeSpinPrompt,700);
  }else{
    if(h.startsWith('login-failed'))toast('LINE 登入沒有成功，請再試一次（'+(h.split('-')[2]||'x')+'）');
    if(h==='login-setup')toast('LINE 登入還在設定中，請稍後再試');
    if(ref)setTimeout(()=>openLogin(ref),500);
  }
})();
